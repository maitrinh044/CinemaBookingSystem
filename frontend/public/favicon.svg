<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C20" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#D92D20" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="cinemaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#redGrad)" stroke-width="4" stroke-opacity="0.3" filter="url(#cinemaGlow)" />

  <!-- Film Clapperboard Body -->
  <g transform="translate(106, 116)">
    <!-- Clapper Base -->
    <rect x="15" y="110" width="270" height="170" rx="24" fill="url(#redGrad)" filter="url(#cinemaGlow)" />
    
    <!-- Top Slanted Clapper Top Bar -->
    <path d="M 5 60 L 285 20 L 295 65 L 15 105 Z" fill="#26282E" stroke="#374151" stroke-width="4" rx="12" />
    
    <!-- Diagonal Stripes on Top Bar -->
    <path d="M 60 52 L 95 47 L 75 97 L 40 102 Z" fill="#F3F4F6" />
    <path d="M 130 42 L 165 37 L 145 87 L 110 92 Z" fill="#F3F4F6" />
    <path d="M 200 32 L 235 27 L 215 77 L 180 82 Z" fill="#F3F4F6" />

    <!-- Center Play Icon with Gold Star Glow -->
    <circle cx="150" cy="195" r="46" fill="#111315" stroke="rgba(255,255,255,0.15)" stroke-width="3" />
    <polygon points="140,175 172,195 140,215" fill="url(#goldGrad)" />
    
    <!-- Mini Star Accent -->
    <path d="M 240 135 L 244 145 L 255 146 L 247 154 L 249 165 L 240 160 L 231 165 L 233 154 L 225 146 L 236 145 Z" fill="url(#goldGrad)" />
  </g>
</svg>